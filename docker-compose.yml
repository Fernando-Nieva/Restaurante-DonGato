name: restaurante-3d

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-Don Gato}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:-base64:ujbFN7zmJ8UabhBFCzodR7cizadob+0kNLnaequ6doU=}
  APP_URL: ${APP_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://127.0.0.1:5173}
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
  DB_CONNECTION: ${DB_CONNECTION:-sqlite}
  DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/sqlite/database.sqlite}
  CACHE_STORE: ${CACHE_STORE:-database}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_STACK: ${LOG_STACK:-single}
  REVERB_APP_ID: ${REVERB_APP_ID:-demo-app-id}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-demo-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-demo-secret}
  REVERB_HOST: ${REVERB_HOST:-reverb}
  REVERB_PORT: ${REVERB_PORT:-8080}
  REVERB_SCHEME: ${REVERB_SCHEME:-http}

x-backend-volumes: &backend-volumes
  - sqlite_data:/var/www/html/database/sqlite
  - laravel_storage:/var/www/html/storage

services:
  backend:
    image: restaurante-3d-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    environment:
      <<: *backend-environment
    volumes: *backend-volumes
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  reverb:
    image: restaurante-3d-backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    environment:
      <<: *backend-environment
    volumes: *backend-volumes
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: restaurante-3d-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-demo-key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
  laravel_storage:
